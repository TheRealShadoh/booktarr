<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Theme-neutral placeholder: mid-grey background works on both light and dark cards -->
  <rect width="400" height="600" fill="#6b6c72"/>
  <rect width="400" height="600" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Book icon -->
  <g transform="translate(100, 200)">
    <rect x="20" y="0" width="160" height="200" fill="#000000" fill-opacity="0.25" rx="4"/>
    <rect x="15" y="5" width="160" height="200" fill="#000000" fill-opacity="0.18" rx="4"/>
    <rect x="10" y="10" width="160" height="200" fill="#f4f1ec" rx="4"/>
    <rect x="10" y="10" width="30" height="200" fill="#e6956f" rx="4"/>
    <line x1="20" y1="20" x2="20" y2="200" stroke="#ed9d72" stroke-width="2"/>
    <line x1="30" y1="20" x2="30" y2="200" stroke="#d97757" stroke-width="2"/>
    <line x1="52" y1="40" x2="150" y2="40" stroke="#9a9ba0" stroke-width="2" opacity="0.6"/>
    <line x1="52" y1="60" x2="130" y2="60" stroke="#9a9ba0" stroke-width="2" opacity="0.6"/>
    <line x1="52" y1="80" x2="140" y2="80" stroke="#9a9ba0" stroke-width="2" opacity="0.6"/>
    <line x1="52" y1="100" x2="125" y2="100" stroke="#9a9ba0" stroke-width="2" opacity="0.6"/>
  </g>

  <text x="200" y="455" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" fill="#f4f1ec" fill-opacity="0.8" text-anchor="middle">No cover</text>
</svg>
